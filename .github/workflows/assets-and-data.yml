# Rigenera assets/manifest.json(.js) e data/bundle.js quando cambiano asset o dati,
# e controlla che i dati siano validi. Così si possono caricare immagini/audio
# direttamente da GitHub (Add file → Upload files) e il gioco li usa da solo.
name: Asset manifest & data bundle

on:
  push:
    paths:
      - 'assets/**'
      - 'data/**.json'
      - '!assets/manifest.json'
      - '!assets/manifest.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data
        run: node tools/validate.mjs
      - name: Rebuild manifest and bundle
        run: |
          node tools/scan-assets.mjs
          node tools/build-data.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/manifest.json assets/manifest.js data/bundle.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/manifest.json assets/manifest.js data/bundle.js
            git commit -m "Aggiorna manifest asset e bundle dati [automatico]"
            git push
          else
            echo "Niente da aggiornare."
          fi
